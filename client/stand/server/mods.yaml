# Моды сервера стенда. Версии ic2 и opencomputers попадают в oc-harness.yaml агента.
# file: имя jar в mods-cache/ и mods/. url: откуда скачать, если в кэше нет.
# sha256: контрольная сумма, вписывается командой `python -m stand.server setup --pin`.
# Если скачивания нет или оно не работает, положите jar в stand/server/mods-cache/ руками.
#
# Эталон это сборка команды (mods.zip). Forge 1.7.10 пускает клиента на сервер, только
# если списки модов совпадают, поэтому для демо клиент должен стоять на этой же сборке.
# Сверху добавлены моды, которых в сборке команды нет: UniMixins и OC NEI Bridge (нужны
# tools nei_* в oc-mcp) и CodeChickenLib явно. Расхождения описаны в docs/real-mcp-notes.md.
forge: "1.7.10-10.13.4.1614"
mods:
  # Сборка команды. Jar без url берутся из mods.zip команды.

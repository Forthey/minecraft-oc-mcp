# Параметры проверок, привязанные к scenario.yaml.
scenario: scenario.yaml
occupied: [100, 64, 100]        # занятая клетка: place_at туда должен дать CANT_PLACE
warehouse_side: front           # с какой стороны от робота склад
warehouse_item: minecraft:cobblestone
absent_item: minecraft:planks   # такого предмета на складе нет: take даёт NO_ITEM
far_point: [500, 64, 500]       # вне разрешённой зоны: move_to даёт OUT_OF_RANGE
unknown_item: nomod:nothing     # несуществующий ID: get_item даёт UNKNOWN_ITEM

[project]
name = "minecraft-oc-mcp"
version = "0.1.0"
description = "MCP for an OpenComputers robot (Minecraft 1.7.10): contract adapter, e2e stand, agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pyyaml",
  "jsonschema",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "memory-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# bridge/ is run by path (python bridge/server.py) and has no dependencies, so it is not packaged.
packages = ["adapter", "stand", "agent"]

[tool.uv.workspace]
members = ["memory"]

[tool.uv.sources]
memory-mcp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["adapter/tests", "stand/tests", "agent/tests", "memory/tests"]
markers = [
  "server: тест требует запущенного сервера Minecraft (pytest -m server)",
]
addopts = '-m "not server"'
